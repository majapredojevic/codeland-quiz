<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <div class="password-result">
    <p id="temporary-password-label" class="password-label">{{ data.label }}</p>
    <div class="password-row">
      <code
        class="temporary-password"
        aria-labelledby="temporary-password-label"
        tabindex="0"
        [textContent]="data.password"
      ></code>
      <button
        class="copy-button"
        type="button"
        [disabled]="isCopying()"
        aria-label="Kopiraj privremenu lozinku"
        (click)="copyPassword()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="8" y="8" width="11" height="11" rx="1.5" />
          <path
            d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-10A1.5 1.5 0 0 0 3 5.5v10A1.5 1.5 0 0 0 4.5 17H8"
          />
        </svg>
        <span aria-live="polite">{{ isCopying() ? 'Kopiranje…' : 'Kopiraj' }}</span>
      </button>
    </div>
  </div>

  <p class="supporting-message">{{ data.supportingMessage }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="close-button" type="button" [mat-dialog-close]="true">Zatvori</button>
</mat-dialog-actions>
