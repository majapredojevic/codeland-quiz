<article class="participant-card" [attr.data-avatar-key]="participant().avatarKey">
  <div class="avatar" aria-hidden="true">
    <svg viewBox="0 0 48 48" focusable="false">
      <path
        d="M14 18.5c0-6.1 4.5-10.5 10-10.5s10 4.4 10 10.5v7c0 7-4.1 12.5-10 12.5s-10-5.5-10-12.5Z"
      />
      <circle cx="20" cy="23" r="1.7" />
      <circle cx="28" cy="23" r="1.7" />
      <path d="M20 29c2.4 1.8 5.6 1.8 8 0" />
    </svg>
    <span>{{ initials(participant().nickname) }}</span>
  </div>

  <div class="participant-copy">
    <strong>{{ participant().nickname }}</strong>
    @if (participant().student?.username; as username) {
      <small>{{ username }}</small>
    }
  </div>

  <span
    class="connection-dot"
    [class.is-connected]="participant().isConnected"
    [attr.aria-label]="
      participant().isConnected ? 'Igrač je aktivan' : 'Igrač trenutno nije aktivan'
    "
    role="img"
  ></span>

  @if (removalAllowed()) {
    <button
      class="remove-player"
      type="button"
      [disabled]="removing()"
      [attr.aria-label]="'Ukloni igrača ' + participant().nickname"
      (click)="remove.emit(participant())"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M7 7l10 10M17 7 7 17" />
      </svg>
    </button>
  }
</article>
