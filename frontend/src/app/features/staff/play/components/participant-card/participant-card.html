<article class="participant-card" [attr.data-avatar-key]="participant().avatarKey">
  <div class="avatar" aria-hidden="true">
    <clq-koda-avatar [avatarKey]="participant().avatarKey" />
  </div>

  <div class="participant-copy">
    <strong>{{ participant().nickname }}</strong>
  </div>

  <span
    class="connection-dot"
    [class.is-connected]="participant().isConnected"
    [attr.aria-label]="
      participant().isConnected ? 'Igrač je aktivan' : 'Igrač trenutno nije aktivan'
    "
    role="img"
  ></span>

  @if (removalAllowed()) {
    <button
      class="remove-player"
      type="button"
      [disabled]="removing()"
      [attr.aria-label]="'Ukloni igrača ' + participant().nickname"
      (click)="remove.emit(participant())"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M7 7l10 10M17 7 7 17" />
      </svg>
    </button>
  }
</article>
