<div class="change-password-page public-page-shell">
  <header class="public-header">
    <div class="brand-slot">
      <picture class="brand-picture">
        <source
          media="(min-width: 600px)"
          srcset="/brand/logo-header.png"
          width="378"
          height="144"
        />
        <img class="brand-logo" ngSrc="/brand/logo-small.png" fill priority alt="CodeLand" />
      </picture>
    </div>
  </header>

  <main class="public-main">
    <section class="password-shell" aria-labelledby="change-password-title">
      <div class="password-card">
        <header class="card-header">
          <p class="eyebrow">Sigurnost naloga</p>
          <h1 id="change-password-title">Promijenite lozinku</h1>
          <p>Prije nastavka postavite novu lozinku za svoj nalog.</p>
        </header>

        <clq-change-password-form />
      </div>
    </section>
  </main>
</div>
